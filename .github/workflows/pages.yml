# Publica o AnatoStudy em fidelidade total no GitHub Pages.
#
# `enablement: true` liga o Pages pela API na primeira execução, então não é
# preciso configurar nada à mão. Cada push publica em
# https://<usuário>.github.io/AnatoStudy/
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/anatomia-humana-3d-react-ldutt4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Habilita o Pages (origem: GitHub Actions) se ainda não estiver ligado.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
